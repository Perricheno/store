services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbanmag
      POSTGRES_USER: urbanmag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["pg:/var/lib/postgresql"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanmag -d urbanmag"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: node:26-bookworm-slim
    working_dir: /app
    command: ["bash", "scripts/dev-web.sh"]
    env_file: ../.env.dev
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://urbanmag:${POSTGRES_PASSWORD}@db:5432/urbanmag
      UPLOADS_DIR: /data/uploads
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
    volumes: ["..:/app", "node_modules:/app/node_modules", "npm_cache:/root/.npm", "next_cache:/app/apps/web/.next", "uploads:/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
    networks:
      private: {}
      frontend: {aliases: [urbanmag-dev-web]}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    restart: unless-stopped
    image: node:26-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "until [ -x node_modules/.bin/tsx ]; do sleep 2; done; ./node_modules/.bin/tsx apps/worker/src/index.ts"]
    env_file: ../.env.dev
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://urbanmag:${POSTGRES_PASSWORD}@db:5432/urbanmag
      NODE_ENV: development
    volumes: ["..:/app", "node_modules:/app/node_modules", "uploads:/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [private]
  mailpit:
    image: axllent/mailpit:latest
    networks: [private]
    ports: ["127.0.0.1:8025:8025"]
volumes:
  pg: {}
  uploads: {}
  node_modules: {}
  npm_cache: {}
  next_cache: {}
networks:
  private: {}
  frontend:
    external: true
    name: urbanmag-dev-frontend
