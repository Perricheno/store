worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $host $upstream {
    default '';
    u.perricheno.com urbanmag-prod-web:3000;
    staff-u.perricheno.com urbanmag-prod-web:3000;
    dev-u.perricheno.com urbanmag-dev-web:3000;
    staff-dev-u.perricheno.com urbanmag-dev-web:3000;
  }
  map $host $zone {
    default '';
    u.perricheno.com shop;
    dev-u.perricheno.com shop;
    staff-u.perricheno.com staff;
    staff-dev-u.perricheno.com staff;
  }
  map $host $static_cache {
    default 'public, max-age=31536000, immutable';
    dev-u.perricheno.com 'no-store';
    staff-dev-u.perricheno.com 'no-store';
  }
  map $host $auth_file {
    default /dev/null;
    dev-u.perricheno.com /run/secrets/dev.htpasswd;
    staff-dev-u.perricheno.com /run/secrets/dev.htpasswd;
  }
  map $host $auth_realm {
    default off;
    dev-u.perricheno.com 'Urbanmag development';
    staff-dev-u.perricheno.com 'Urbanmag development';
  }
  server {
    listen 8080 default_server;
    client_max_body_size 20m;
    if ($upstream = '') { return 444; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Urbanmag-Zone $zone;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    auth_basic $auth_realm;
    auth_basic_user_file $auth_file;
    location = /api/webhooks/apipay { auth_basic off; proxy_pass http://$upstream; }
    location ^~ /api/media/ {
      proxy_pass http://$upstream;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $static_cache always;
    }
    location ^~ /_next/static/ {
      proxy_pass http://$upstream;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $static_cache always;
    }
    location ^~ /api/ { proxy_pass http://$upstream; proxy_hide_header Cache-Control; add_header Cache-Control 'no-store' always; }
    location / { proxy_pass http://$upstream; }
  }
}
