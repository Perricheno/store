worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $host $upstream {
    default '';
    u.perricheno.com urbanmag-prod-web:3000;
    staff-u.perricheno.com urbanmag-prod-web:3000;
    dev-u.perricheno.com urbanmag-dev-web:3000;
    staff-dev-u.perricheno.com urbanmag-dev-web:3000;
  }
  map $host $zone {
    default '';
    u.perricheno.com shop;
    dev-u.perricheno.com shop;
    staff-u.perricheno.com staff;
    staff-dev-u.perricheno.com staff;
  }
  map $host $static_cache {
    default 'public, max-age=31536000, immutable';
    dev-u.perricheno.com 'no-store';
    staff-dev-u.perricheno.com 'no-store';
  }
  map $host $dev_access {
    default 0;
    dev-u.perricheno.com 1;
    staff-dev-u.perricheno.com 1;
  }
  server {
    listen 8080 default_server;
    # Keep the external HTTPS origin when the tunnel terminates TLS.
    absolute_redirect off;
    client_max_body_size 20m;
    if ($upstream = '') { return 444; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Urbanmag-Zone $zone;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    auth_request /_urbanmag/dev-access;
    error_page 401 = @dev_login;
    location = /_urbanmag/dev-access {
      internal;
      if ($dev_access = 0) { return 204; }
      proxy_pass http://$upstream/api/dev-access/check;
      proxy_pass_request_body off;
      # This is a cookie check, not an RSC request for the original page.
      # Forwarding Next router headers makes Next redirect this different URI.
      proxy_pass_request_headers off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
    location @dev_login {
      return 302 /api/dev-access/login?next=$request_uri;
    }
    location = /api/dev-access/login { auth_request off; proxy_pass http://$upstream; }
    location = /api/webhooks/apipay { auth_request off; proxy_pass http://$upstream; }
    location ~ ^/fonts/inter-(latin|cyrillic|cyrillic-ext)-wght-normal\.woff2$ {
      auth_request off;
      proxy_pass http://$upstream;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $static_cache always;
    }
    location ^~ /api/media/ {
      proxy_pass http://$upstream;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $static_cache always;
    }
    location ^~ /_next/static/ {
      proxy_pass http://$upstream;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $static_cache always;
    }
    location ^~ /api/ { error_page 401 = @dev_api_denied; proxy_pass http://$upstream; proxy_hide_header Cache-Control; add_header Cache-Control 'no-store' always; }
    location @dev_api_denied {
      default_type application/json;
      add_header Cache-Control 'no-store' always;
      return 401 '{"error":"dev_access_required"}';
    }
    location / { proxy_pass http://$upstream; }
  }
}
