name: CI
on:
  push:
    branches: ['**']
    tags: ['dev/v*', 'prod/v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: urbanmag_test
          POSTGRES_PASSWORD: urbanmag_test
          POSTGRES_DB: urbanmag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanmag_test -d urbanmag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @urbanmag/core
        env:
          CORE_TEST_DATABASE_URL: postgres://urbanmag_test:urbanmag_test@localhost:5432/urbanmag_test
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
